# ============================================================================
# Attendance module — Apache wiring. Include from the vhost that serves the
# portal (e.g. inside the <VirtualHost> in sites-enabled/wordpress.conf on dev,
# or the nginx equivalent documented in RUNBOOK.md on production):
#
#   Include /srv/www/phdtimeoff/attendance/ops/apache-attendance.conf
#
# Requires: a2enmod proxy proxy_http headers   (all already loaded on dev)
#
# IMPORTANT — the WiFi gate depends on the RequestHeader line below.
# X-Client-IP is set unconditionally from the TCP peer address, so a client
# can never inject it. The backend trusts ONLY this header, never
# X-Forwarded-For (mod_proxy APPENDS to XFF, so its first element is
# attacker-controlled).
# ============================================================================

RequestHeader set X-Client-IP "expr=%{REMOTE_ADDR}"

# Face capture requires a secure context in every browser: HTTPS in general,
# but http://localhost is also treated as secure — handy for desk testing.
# Production must serve this behind TLS.

ProxyPreserveHost On
ProxyTimeout 90

# Host-only job endpoints (report/purge/cleanup) must not be reachable through
# the web at all — the systemd timers call 127.0.0.1:3070 directly.
<Location "/phdtimeoff/attendance/api/jobs">
    Require all denied
</Location>

ProxyPass        "/phdtimeoff/attendance/api" "http://127.0.0.1:3070/api"
ProxyPassReverse "/phdtimeoff/attendance/api" "http://127.0.0.1:3070/api"

# Belt-and-braces: the attendance/ source directory also carries a
# "Require all denied" .htaccess so nothing in it is ever served as a file.
<Directory "/srv/www/phdtimeoff/attendance">
    Require all denied
</Directory>
