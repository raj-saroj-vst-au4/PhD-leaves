; PHP-FPM per-directory settings (read for every request under this folder;
; nginx refuses dot-files, so this is never served).
;
; Production's FPM php.ini sets date.timezone = GMT while the server, cron and
; MariaDB run on IST; config/constants.php also pins Asia/Kolkata for the app.
; This makes IST the default for anything that runs before or without it.
; Changing php.ini itself needs root. FPM re-reads this file within
; user_ini.cache_ttl (300 s by default).
date.timezone = Asia/Kolkata
