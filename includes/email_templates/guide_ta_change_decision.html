<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guide / TA change decision</title>
    <style>
        body { margin:0; padding:0; font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
               background-color:#f3f4f6; color:#1f2937; }
        .wrap { max-width:640px; margin:0 auto; padding:24px 16px; }
        .card { background:#ffffff; border-radius:8px; overflow:hidden;
                box-shadow:0 1px 3px rgba(0,0,0,.1); }
        .head { background:#1d4ed8; color:#ffffff; padding:20px 24px; }
        .head h1 { margin:0; font-size:20px; }
        .body { padding:24px; font-size:14px; line-height:1.6; }
        .body ul { margin:12px 0; padding-left:20px; }
        .note { background:#eff6ff; border-left:4px solid #1d4ed8; padding:12px 14px;
                border-radius:4px; font-size:13px; margin:16px 0; }
        .btn { display:inline-block; background:#1d4ed8; color:#ffffff !important;
               text-decoration:none; padding:12px 22px; border-radius:6px;
               font-weight:600; font-size:14px; }
        .foot { padding:16px 24px; background:#f9fafb; color:#6b7280; font-size:12px; }
    </style>
</head>
<body>
<div class="wrap">
    <div class="card">
        <div class="head">
            <h1>Your guide / TA change request</h1>
        </div>
        <div class="body">
            <p>Dear {STUDENT_NAME},</p>

            <p>{OUTCOME}</p>

            {DETAIL}

            {REMARKS}

            <p style="text-align:center;margin:26px 0 8px">
                <a class="btn" href="{ACTION_URL}">View my leave applications</a>
            </p>
        </div>
        <div class="foot">
            This is an automated message from {SITE_NAME}. Please do not reply.
        </div>
    </div>
</div>
</body>
</html>
